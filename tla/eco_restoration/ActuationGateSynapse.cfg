\* ActuationGateSynapse.cfg
\* TLC configuration for ActuationGateSynapse.tla

SPECIFICATION Spec

CONSTANTS
  \* Maximum allowed ΔVt per step
  DeltaVMax    = 0.05

  \* Minimal ker_s required to consider actuation
  KerThreshold = 0.3

  \* Coupling coefficients for ΔVt <= Gamma * ker_s and carbon-aware corridor
  Gamma        = 0.1
  Delta        = 0.1

  \* Discrete carbon bands used in the model
  CarbonBands  = {"GREEN", "NEUTRAL", "RED"}

\* STATE CONSTRAINTS and CONSTANT DEFINITIONS for discrete exploration
\* We restrict ker_k, ker_e, ker_r, and delta_v_t_step to small finite sets
\* by overriding CHOOSE sets via DEFINEs or by adding constraints.

\* Optional invariants to monitor in addition to the theorem:
INVARIANTS
  CorridorSafe

\* We can also add coverage constraints to ensure TLC explores states
\* where corridor violations would be possible if the gate were incorrect.
\* For example, monitor when delta_v_t_step > DeltaVMax or ker_s <= KerThreshold.
PROPERTY
  [](CorridorSafe)

\* For more fine-grained control, you can add state constraints here, e.g.:
\* INIT definition overrides (if you use a separate InitAlt) or restrict
\* Reals to specific values using ASSUME statements in the TLA+ module.
