# filename: prometheus-praxis/spine/Cargo.toml

[package]
name = "prometheus-praxis-spine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["mk-bluebird <bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7>"]
description = "KER–Lyapunov foundational spine (RiskCoord, RiskVector, LyapunovWeights, Residual, SafeStepGate, corridor grammar) for Prometheus-Praxis."
repository = "https://github.com/mk-bluebird/Prometheus-Praxis"
readme = "README.md"

[lib]
name = "prometheus_praxis_spine"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }

[dev-dependencies]
kani-verifier = "0.67.0"

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true

[profile.release]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "abort"
