# File: docker/docker-compose.yml
services:
  telemetry:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /data
    command: >
      set -eu;
      executable="$(find /opt/prometheus-praxis -type f -name lorawan_telemetry_bridge -perm -111 -print -quit)";
      test -n "$executable";
      exec "$executable" /data/eco.sqlite 8081
    environment:
      CHIRPSTACK_BRIDGE_TOKEN: ${CHIRPSTACK_BRIDGE_TOKEN:?set_CHIRPSTACK_BRIDGE_TOKEN}
    volumes:
      - eco-data:/data
    init: true
    restart: unless-stopped

  lane-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /data
    command: >
      set -eu;
      executable="$(find /opt/prometheus-praxis -type f -name eco_workload_admission -perm -111 -print -quit)";
      test -n "$executable";
      exec "$executable"
    volumes:
      - eco-data:/data
    init: true
    restart: "no"

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /data
    command: >
      set -eu;
      executable="$(find /opt/prometheus-praxis -type f -name hex_state_dashboard -perm -111 -print -quit)";
      test -n "$executable";
      exec "$executable" /data/eco.sqlite 8080
    volumes:
      - eco-data:/data
    depends_on:
      telemetry:
        condition: service_started
    init: true
    restart: unless-stopped

volumes:
  eco-data:
