
[package]
name        = "urban_climate_evaluation"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.85"
license     = "MIT OR Apache-2.0"
description = "Prometheus-Praxis urban climate model evaluation kernel (KER/RoH/Biodiversity/Lyapunov-aligned)"
authors     = ["Prometheus-Praxis <bostaln18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7>"]
repository  = "https://github.com/mk-bluebird/Prometheus-Praxis"

[lib]
name = "urban_climate_evaluation"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde       = { version = "1.0.203", features = ["derive"] }
serde_json  = { version = "1.0.120" }
alncore     = { path = "../../alncore" } # adjust to actual alncore crate path in repo

# If you use chrono or time for timestamps, add:
# chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
kani = { version = "0.67", features = ["derive"] }

[features]
# Kani is not optional; we expose a feature gate only for compilation mode, not semantics.
kani-verifier = []
