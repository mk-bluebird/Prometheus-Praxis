# crates/bostrom-cli/Cargo.toml

[package]
name = "bostrom-cli"
version = "0.1.0"
edition = "2024"
description = "CLI tool for Bostrom DID operations and blacklist guard; non-actuating EcoNet-aligned governance helper."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mk-bluebird/Prometheus-Praxis"
authors = ["mk-bluebird <bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7>"]
rust-version = "1.85"

[lib]
name = "bostrom_cli"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "bostrom-cli"
path = "src/main.rs"

[dependencies]
# Local governance / safety crates
blacklist_filter = { path = "../blacklist_filter" }

# Core ecosystem stack (versions taken from Eco-Fort / EcoNet workspace)
serde = { version = "1.0.203", features = ["derive"] }        # matches workspace serde [file:5]
serde_json = { version = "1.0.120" }                          # matches workspace serde_json [file:5]
thiserror = "1.0.57"                                          # aligns with governance crates [file:33]
chrono = { version = "0.4.38", features = ["clock", "serde"] }# consistent with Eco-Fort [file:5]
log = "0.4.21"                                                # shared logging layer [file:33]
env_logger = "0.11.3"                                         # CI/CLI-friendly logging [file:33]

# SQLite + governance spine integration (read-only, non-actuating)
rusqlite = { version = "0.32.1", features = ["bundled"] }     # same as Eco-Fort workspace [file:5]

# Kani must never be optional; pulled in as dev-dependency for this crate.
[dev-dependencies]
kani-verifier = "0.67.0"                                      # precise Kani version per ecosystem standard [file:5]

[profile.dev]
panic = "abort"
overflow-checks = true

[profile.release]
panic = "abort"
lto = "fat"
overflow-checks = true
opt-level = 2
codegen-units = 1
strip = "symbols"

[profile.test]
overflow-checks = true

[workspace.metadata.kani]
# Explicit Kani configuration to ensure proofs run consistently.
flags = ["default-unwind=4"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
