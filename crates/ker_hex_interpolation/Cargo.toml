# Filename: crates/ker_hex_interpolation/Cargo.toml
# Destination: Prometheus-Praxis/crates/ker_hex_interpolation/Cargo.toml

[package]
name = "ker_hex_interpolation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["mk-bluebird <bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7>"]
description = "Constrained ordinary kriging over scalar KER scores for hex-anchored eco-restoration diagnostics."

[lib]
name = "ker_hex_interpolation"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = { version = "1.0.120" }

[dev-dependencies]
serde_json = { version = "1.0.120" }

[features]
default = []

[package.metadata.kani]
# Kani verifier configuration is non-optional in this ecosystem.
enabled = true
version = "0.67.0"
