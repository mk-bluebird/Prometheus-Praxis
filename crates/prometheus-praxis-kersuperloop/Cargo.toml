# filename: crates/prometheus-praxis-kersuperloop/Cargo.toml
# destination: https://github.com/mk-bluebird/Prometheus-Praxis/crates/prometheus-praxis-kersuperloop/Cargo.toml

[package]
name = "prometheus-praxis-kersuperloop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Non-actuating KER-Lyapunov superloop diagnostics for Phoenix workloads in Prometheus-Praxis."
repository = "https://github.com/mk-bluebird/Prometheus-Praxis"

[dependencies]
chrono = { version = "0.4.38", features = ["clock", "serde"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = { version = "1.0.120" }
thiserror = "1.0.57"
