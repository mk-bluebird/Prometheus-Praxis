# filename: crates/aln-cyboquatic-codegen/Cargo.toml

[package]
name = "aln-cyboquatic-codegen"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["mk-bluebird <bostrom18sd2ujv24ual9c9pshtxys6j8knh6xaead9ye7>"]
description = "ALN-driven code generation for cyboquatic C++ headers and SQLite schemas in Prometheus-Praxis."
readme = "../../README.md"
repository = "https://github.com/mk-bluebird/Prometheus-Praxis"
keywords = ["aln", "codegen", "cyboquatic", "ecosafety"]
categories = ["command-line-utilities", "science"]

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = { version = "1.0.120" }

# Kani is mandatory; kept in dependencies so it is always available.
kani = "0.67.0"

[lib]
name = "aln_cyboquatic_codegen"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "aln-cyboquatic-codegen"
path = "src/bin/aln_codegen_main.rs"

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true

[profile.release]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1
overflow-checks = true

[workspace]
members = [
    "."
]

[workspace.metadata]
prometheus-praxis-band = "cyboquatic-codegen"
